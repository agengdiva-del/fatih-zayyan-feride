name: Build React Vite to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & Build Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.example.fatihzayyan",
            "appName": "FatihZayyan",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
